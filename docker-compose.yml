# Two ways to run the same images:
#
#   docker compose up --build
#     The single-container mode (ROLE=all): one process does everything, state on a volume
#     or in Postgres. What Railway runs today.
#
#   docker compose --profile split up --build
#     The split mode: a slim api that only enqueues and serves, a worker that executes jobs
#     and schedules, a browser service driving Chrome, Postgres as the source of truth and job
#     queue, Redis carrying events between them. The shape that scales horizontally.
#     Needs ACP_MASTER_KEY in .env (openssl rand -hex 32): the split services refuse to start
#     without one shared key.
#
# Secrets: ACP_ADMIN_TOKEN and ACP_INGEST_TOKEN have NO defaults on purpose. Leave them unset
# and the app walks you through creating real ones on first visit; a baked-in placeholder
# would be the same password on every install that ever copied this file. The split mode
# needs POSTGRES_PASSWORD set in .env — there is no fallback for the database either. Note:
# compose interpolates `${VAR:?}` even for profiles that are not running, so plain
# `docker compose up` (single-container profile, no Postgres) also needs POSTGRES_PASSWORD
# present in .env — any value; the single container never uses it.
#
# Only the api publishes a port. Never publish the worker or browser ports: they trust their
# network neighbours (the queue, the VNC bridge) and have no login of their own.
#
# Guides: docs/local.md (this machine), docs/railway.md, docs/self-hosted.md.
#
# Dashboard: http://localhost:8080   Browser screen: http://localhost:8080/vnc/
services:
  acp:
    profiles: ["all", ""]
    build: .
    ports:
      - "8080:8080"
    environment:
      ACP_ADMIN_TOKEN: ${ACP_ADMIN_TOKEN:-}
      ACP_INGEST_TOKEN: ${ACP_INGEST_TOKEN:-}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      SYNC_INTERVAL_MIN: ${SYNC_INTERVAL_MIN:-20}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      IMAP_HOST: ${IMAP_HOST:-}
      IMAP_USER: ${IMAP_USER:-}
      IMAP_PASS: ${IMAP_PASS:-}
    volumes:
      - acp-data:/data
    shm_size: "1g"
    mem_limit: 3g
    # Chrome's sandbox needs setuid/userns, so this service gets the tailored seccomp profile
    # (docker/seccomp_profile.json) instead of no-new-privileges.
    security_opt: ["seccomp:./docker/seccomp_profile.json"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||8080)+'/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  db:
    profiles: ["split"]
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env - the split database has no default password}
      POSTGRES_DB: acp
    volumes:
      - acp-pg:/var/lib/postgresql/data
    mem_limit: 1g
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    profiles: ["split"]
    image: redis:7-alpine
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    profiles: ["split"]
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8080:8080"
    environment:
      ROLE: api
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/acp
      REDIS_URL: redis://redis:6379
      ACP_ADMIN_TOKEN: ${ACP_ADMIN_TOKEN:-}
      ACP_INGEST_TOKEN: ${ACP_INGEST_TOKEN:-}
      ACP_MASTER_KEY: ${ACP_MASTER_KEY:-}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      # The live browser screen lives on the browser worker in split mode.
      VNC_TARGET: http://browser:6080
    mem_limit: 1g
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||8080)+'/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # No ports on the worker or browser: they are reachable from inside the compose network
  # only, and must stay that way.
  worker:
    profiles: ["split"]
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      ROLE: worker
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/acp
      REDIS_URL: redis://redis:6379
      ACP_MASTER_KEY: ${ACP_MASTER_KEY:-}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      IMAP_HOST: ${IMAP_HOST:-}
      IMAP_USER: ${IMAP_USER:-}
      IMAP_PASS: ${IMAP_PASS:-}
    mem_limit: 1g
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||8080)+'/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  browser:
    profiles: ["split"]
    build: .
    environment:
      ROLE: browser
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/acp
      REDIS_URL: redis://redis:6379
      ACP_MASTER_KEY: ${ACP_MASTER_KEY:-}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      SYNC_INTERVAL_MIN: ${SYNC_INTERVAL_MIN:-20}
      VNC_BIND: 0.0.0.0
    volumes:
      - acp-worker-data:/data
    shm_size: "1g"
    mem_limit: 3g
    # Chrome's sandbox needs setuid/userns, so the browser gets the tailored seccomp profile
    # (docker/seccomp_profile.json) instead of no-new-privileges.
    security_opt: ["seccomp:./docker/seccomp_profile.json"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||8080)+'/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  acp-data:
  acp-pg:
  acp-worker-data:
