# Railway config for the single-service deployment (ROLE=all). See docs/railway.md.
# Data: add Postgres and set DATABASE_URL=${{Postgres.DATABASE_URL}} plus ACP_MASTER_KEY,
# or attach a volume at /data for the SQLite file. Split services use railway/*.toml.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
