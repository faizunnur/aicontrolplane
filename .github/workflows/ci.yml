name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: acp_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["56379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Boundary checks (only packages/data touches SQL; core routes/orchestration never drive the browser directly)
        run: |
          ! grep -rn "better-sqlite3" src/ --include="*.ts"
          ! grep -rn "\.prepare(" src/ --include="*.ts"
          ! grep -n "browser/manager" src/router.ts src/actions.ts src/deliver.ts src/tasks.ts src/policy.ts src/answers.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: The compiled server serves the dashboard (what the Docker images run)
        run: |
          PORT=18080 BROWSER_ENABLED=false DATA_DIR=$(mktemp -d) node dist/src/bootstrap.js &
          for i in $(seq 1 30); do curl -sf localhost:18080/healthz >/dev/null && break; sleep 1; done
          curl -sf localhost:18080/ | grep -q "<html"
          curl -sf -o /dev/null localhost:18080/connect.mjs
          kill %1
      - name: Install Playwright Chromium (e2e mock-provider tests)
        run: npx playwright install --with-deps chromium
      - name: Unit tests (SQLite driver)
        run: npm test
      - name: Unit tests (Postgres driver — conformance)
        run: npm test
        env:
          TEST_PG_URL: postgres://postgres:test@localhost:55432/acp_test
      - name: E2E (SQLite driver)
        run: npm run test:e2e
        env:
          HEADLESS: "true"
      - name: E2E (Postgres driver, incl. split-role stack)
        run: npm run test:e2e
        env:
          HEADLESS: "true"
          TEST_PG_URL: postgres://postgres:test@localhost:55432/acp_test
          TEST_REDIS_URL: redis://127.0.0.1:56379

  # Production dependencies must be clean of known highs. The tree is clean today, so this
  # fails hard; dev-only advisories are out of scope (they never ship in the images).
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

  # Both images must build from a cold checkout (amd64, never pushed), and their contents are
  # scanned. Trivy findings warn rather than fail for now (base-image CVEs land on their own
  # schedule); tighten continue-on-error once a baseline of clean runs exists.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - name: browser
            dockerfile: Dockerfile
          - name: api
            dockerfile: Dockerfile.api
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.name }} image (amd64, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          load: true
          tags: acp-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
      - name: Trivy scan (HIGH+CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        continue-on-error: true
        with:
          image-ref: acp-${{ matrix.name }}:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
