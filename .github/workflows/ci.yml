name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Boundary checks (only packages/data touches SQL)
        run: |
          ! grep -rn "better-sqlite3" src/ scripts/ --include="*.ts"
          ! grep -rn "\.prepare(" src/ scripts/ --include="*.ts"
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Install Playwright Chromium (e2e mock-provider tests)
        run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:e2e
        env:
          HEADLESS: "true"
