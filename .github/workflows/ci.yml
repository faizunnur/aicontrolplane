name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: acp_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["56379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Boundary checks (only packages/data touches SQL; core routes/orchestration never drive the browser directly)
        run: |
          ! grep -rn "better-sqlite3" src/ --include="*.ts"
          ! grep -rn "\.prepare(" src/ --include="*.ts"
          ! grep -n "browser/manager" src/router.ts src/actions.ts src/deliver.ts src/tasks.ts src/policy.ts src/answers.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Install Playwright Chromium (e2e mock-provider tests)
        run: npx playwright install --with-deps chromium
      - name: Unit tests (SQLite driver)
        run: npm test
      - name: Unit tests (Postgres driver — conformance)
        run: npm test
        env:
          TEST_PG_URL: postgres://postgres:test@localhost:55432/acp_test
      - name: E2E (SQLite driver)
        run: npm run test:e2e
        env:
          HEADLESS: "true"
      - name: E2E (Postgres driver, incl. split-role stack)
        run: npm run test:e2e
        env:
          HEADLESS: "true"
          TEST_PG_URL: postgres://postgres:test@localhost:55432/acp_test
          TEST_REDIS_URL: redis://127.0.0.1:56379
